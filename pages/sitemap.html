<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitemap | Signal</title>
<meta name="description" content="A full listing of every page on Signal.">
<link rel="canonical" href="https://your-domain.example/pages/sitemap.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128225;</text></svg>">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-root="../" data-page="legal">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" id="site-header"></header>
<main id="main">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a><span class="sep">/</span><span aria-current="page">Sitemap</span>
    </nav>
  </div>
  <section class="page-head">
    <div class="container">
      <h1>Sitemap</h1>
      <p>Every page on Signal, in one place. See also the machine-readable <a href="../sitemap.xml" style="text-decoration:underline;">sitemap.xml</a>.</p>
    </div>
  </section>
  <section class="section">
    <div class="container content-layout">
      <div>
        <div class="section-head"><h2>Main pages</h2></div>
        <ul class="widget-list" style="margin-bottom: 36px;">
          <li><a class="wl-title" href="../index.html">Home</a></li>
          <li><a class="wl-title" href="about.html">About</a></li>
          <li><a class="wl-title" href="contact.html">Contact</a></li>
          <li><a class="wl-title" href="privacy.html">Privacy Policy</a></li>
          <li><a class="wl-title" href="terms.html">Terms of Service</a></li>
        </ul>
        <div class="section-head"><h2>Articles</h2></div>
        <ul class="widget-list" id="sitemap-articles"></ul>
      </div>
      <div id="site-sidebar"></div>
    </div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="../assets/js/script.js"></script>
<script src="../assets/js/ads.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var list = document.getElementById("sitemap-articles");
    SIGNAL.POSTS.forEach(function (p) {
      var li = document.createElement("li");
      li.innerHTML = '<a class="wl-title" href="' + p.slug + '.html">' + p.title + '</a>';
      list.appendChild(li);
    });
  });
</script>
</body>
</html>
